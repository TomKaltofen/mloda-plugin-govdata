name: Diagnose GovData reachability

on:
  push:
    branches: [diag/ckan-reachability]
  workflow_dispatch:

permissions: {}

jobs:
  long-connect:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: 120 s connect timeout
        run: |
          for url in 'https://ckan.govdata.de/api/3/action/package_search?q=test&rows=1' 'https://www-genesis.destatis.de/'; do
            curl -sS -o /dev/null --connect-timeout 120 --max-time 150 \
              -w "$url: code=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" "$url" \
              || echo "$url: FAILED after the 120 s connect timeout"
          done
